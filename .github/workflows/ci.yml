name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  image:
    needs: test
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      push: ${{ github.event_name != 'pull_request' }}
