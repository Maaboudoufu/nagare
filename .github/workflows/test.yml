name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...

  translations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/check_i18n.py
      - name: Translated courses keep every code block, link and quiz intact
        run: |
          shopt -s nullglob
          for f in courses/*/index.json; do
            dir=$(dirname "$f")
            for c in "$dir"/*.json; do
              [ "$c" = "$f" ] || python3 tools/check_course_translation.py "$(basename "$c" .json)" "$c"
            done
          done
      - run: python3 server/gamify.py
