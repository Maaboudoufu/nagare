<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 536 164' width='536' height='164' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>
<defs><marker id='a0' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a93a6'/></marker><marker id='a1' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#E2B66B'/></marker><marker id='a2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#7AA7FF'/></marker><marker id='a3' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#62BE8C'/></marker><marker id='a4' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#F08A9C'/></marker></defs>
<rect width='100%' height='100%' rx='10' fill='#1c2029'/>
<text x='268.0' y='22' fill='#e6e8ee' font-size='13' text-anchor='middle'>what happens when you write  BobaCooker c(3);</text>
<rect x='10' y='40' width='160' height='84' rx='6' fill='#2a2f3a' stroke='#8a93a6' stroke-width='1.8'/>
<text x='90.0' y='58' fill='#e6e8ee' font-size='13' font-weight='bold' text-anchor='middle'>1. memory</text>
<line x1='10' y1='65' x2='170' y2='65' stroke='#8a93a6' stroke-width='1'/>
<text x='90.0' y='82' fill='#e6e8ee' font-size='12' text-anchor='middle'>room for every</text>
<text x='90.0' y='100' fill='#e6e8ee' font-size='12' text-anchor='middle'>member is set aside</text>
<line x1='170' y1='82' x2='186' y2='82' stroke='#8a93a6' stroke-width='1.8' marker-end='url(#a0)'/>
<rect x='188' y='40' width='160' height='84' rx='6' fill='#5a4520' stroke='#E2B66B' stroke-width='1.8'/>
<text x='268.0' y='58' fill='#e6e8ee' font-size='13' font-weight='bold' text-anchor='middle'>2. init list</text>
<line x1='188' y1='65' x2='348' y2='65' stroke='#E2B66B' stroke-width='1'/>
<text x='268.0' y='82' fill='#e6e8ee' font-size='12' text-anchor='middle'>each member is</text>
<text x='268.0' y='100' fill='#e6e8ee' font-size='12' text-anchor='middle'>built, with a value</text>
<line x1='348' y1='82' x2='364' y2='82' stroke='#8a93a6' stroke-width='1.8' marker-end='url(#a0)'/>
<rect x='366' y='40' width='160' height='84' rx='6' fill='#22355a' stroke='#7AA7FF' stroke-width='1.8'/>
<text x='446.0' y='58' fill='#e6e8ee' font-size='13' font-weight='bold' text-anchor='middle'>3. body { }</text>
<line x1='366' y1='65' x2='526' y2='65' stroke='#7AA7FF' stroke-width='1'/>
<text x='446.0' y='82' fill='#e6e8ee' font-size='12' text-anchor='middle'>members already</text>
<text x='446.0' y='100' fill='#e6e8ee' font-size='12' text-anchor='middle'>exist; = assigns</text>
<text x='268' y='150' fill='#8a93a6' font-size='11' text-anchor='middle'>a const or reference member must get its value in step 2</text>
</svg>