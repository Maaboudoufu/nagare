<rect width='100%' height='100%' rx='0' fill='#0F1216'/>
<text font-family='ui-monospace,SFMono-Regular,Menlo,monospace' x='268.0' y='22' fill='#E9EBEE' font-size='13' text-anchor='middle'>what happens when you write  BobaCooker c(3);</text>
<rect x='10' y='40' width='160' height='84' rx='3' fill='#161A21' stroke='#2E3540' stroke-width='1'/>
<text x='90.0' y='58' fill='#E9EBEE' font-size='13' font-weight='600' text-anchor='middle'>1. memory</text>
<line x1='10' y1='65' x2='170' y2='65' stroke='#2E3540' stroke-width='1'/>
<text x='90.0' y='82' fill='#E9EBEE' font-size='12' text-anchor='middle'>room for every</text>
<text x='90.0' y='100' fill='#E9EBEE' font-size='12' text-anchor='middle'>member is set aside</text>
<line x1='170' y1='82' x2='186' y2='82' stroke='#2E3540' stroke-width='1' marker-end='url(#a0)'/>
<rect x='188' y='40' width='160' height='84' rx='3' fill='#241F16' stroke='#C4A26A' stroke-width='1.5'/>
<text x='268.0' y='58' fill='#E9EBEE' font-size='13' font-weight='600' text-anchor='middle'>2. init list</text>
<line x1='188' y1='65' x2='348' y2='65' stroke='#C4A26A' stroke-width='1.5'/>
<text x='268.0' y='82' fill='#E9EBEE' font-size='12' text-anchor='middle'>each member is</text>
<text x='268.0' y='100' fill='#E9EBEE' font-size='12' text-anchor='middle'>built, with a value</text>
<line x1='348' y1='82' x2='364' y2='82' stroke='#2E3540' stroke-width='1' marker-end='url(#a0)'/>
<rect x='366' y='40' width='160' height='84' rx='3' fill='#18202E' stroke='#7E9AC4' stroke-width='1.5'/>
<text font-family='ui-monospace,SFMono-Regular,Menlo,monospace' x='446.0' y='58' fill='#E9EBEE' font-size='13' font-weight='600' text-anchor='middle'>3. body { }</text>
<line x1='366' y1='65' x2='526' y2='65' stroke='#7E9AC4' stroke-width='1.5'/>
<text x='446.0' y='82' fill='#E9EBEE' font-size='12' text-anchor='middle'>members already</text>
<text font-family='ui-monospace,SFMono-Regular,Menlo,monospace' x='446.0' y='100' fill='#E9EBEE' font-size='12' text-anchor='middle'>exist; = assigns</text>
<text x='268' y='150' fill='#9BA3AF' font-size='11.5' text-anchor='middle'>a const or reference member must get its value in step 2</text>
