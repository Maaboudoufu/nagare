# Copy this file to the server (plus an optional .env, see .env.example), then:
#   docker compose up -d   -> http://localhost:8000
# The lesson media (~11 GB) downloads in the background on first start. Lessons work in the meantime.
#
# Hosting: put an HTTPS reverse proxy in front and set BASE_URL=https://<domain>. Proxy on this host: forward to
# 127.0.0.1:8000 (or join nagare_default and use nagare-app-1:8000). Proxy elsewhere: set NAGARE_PORT. Enable websockets.

name: nagare

x-image: &image ${NAGARE_IMAGE:-ghcr.io/maaboudoufu/nagare:latest}

services:
  app:
    image: *image
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ADDR: 0.0.0.0:8000
      SANDBOX_IMAGE: *image
      HOME: /tmp
    ports:
      - "${NAGARE_PORT:-127.0.0.1:8000}:8000" # proxy on another machine: NAGARE_PORT=8000 in .env, firewall it
    volumes:
      # Runs users' containers. This socket is root on the host: give this app its own host.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./media:/app/media:ro
    stop_grace_period: 30s

  # Downloads missing media and checks every file against media.lock.json, then exits. Reruns on each `up`.
  media:
    image: *image
    command: [python3, tools/fetch_media.py]
    restart: "no"
    volumes:
      - ./media:/app/media
